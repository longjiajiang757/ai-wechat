name: Build APK

# 推送代码或手动点击都会打包，并把 APK 挂到一个固定网址上，浏览器点开即可下载
on:
  push:
    branches: ['**']
  workflow_dispatch:

# 连续推送时，取消上一次还在跑的构建，省时间也省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与上游保持一致：JetBrains Runtime 21
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'jetbrains'
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # web 模块的 preBuild 会构建 web-ui 前端，必须有 Node + pnpm
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 不需要配置任何 secret：
      # - Firebase 已移除，不需要 google-services.json
      # - 签名密钥 app/ai-wechat.jks 已随仓库提交
      - name: Read versionName
        id: version
        run: |
          V=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$V" ]; then echo "读不到 versionName" >&2; exit 1; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "release 名称（=App 更新检查的版本号）: $V"

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleGithubRelease --stacktrace

      # 把文件名改成固定名字，下载网址才不会每次都变。
      # 不写死文件名：按 "universal"/"arm64" 关键字找，AGP 改了命名也不会挂。
      - name: Rename APKs to stable names
        run: |
          set -euo pipefail
          cd app/build/outputs/apk/github/release
          echo "--- 原始产物 ---"
          ls -lh *.apk

          # 注意：set -e + pipefail 下 ls 没匹配会返回非 0，必须 || true 兜住
          UNIV=$(ls *universal*.apk 2>/dev/null | head -1 || true)
          ARM=$(ls *arm64*.apk 2>/dev/null | head -1 || true)

          # 没有 universal（比如上游改了 splits 配置）就退而用任意一个，保证一定有下载文件
          if [ -z "$UNIV" ]; then UNIV=$(ls *.apk 2>/dev/null | head -1 || true); fi
          if [ -z "$UNIV" ]; then
            echo "错误: 没有找到任何 APK，打包环节可能失败了" >&2
            exit 1
          fi

          cp "$UNIV" ai-wechat.apk
          echo "通用版 <- $UNIV"

          if [ -n "$ARM" ]; then
            cp "$ARM" ai-wechat-arm64.apk
            echo "arm64 版 <- $ARM"
          fi

          echo "--- 重命名后 ---"
          ls -lh ai-wechat*.apk

      - name: Upload APK (构建产物，需登录才能下)
        uses: actions/upload-artifact@v4
        with:
          name: ai-wechat-apk
          path: app/build/outputs/apk/github/release/ai-wechat*.apk
          if-no-files-found: error

      # 关键一步：用固定 tag "latest"，网址永久不变，每次推送覆盖更新
      # 公开仓库下这个地址免登录、浏览器直接下载
      - name: Publish to fixed release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          # App 的更新检查读这个 name 当版本号（UpdateChecker 从 release.name 解析），
          # 必须保持就是 versionName 本身，前后不要加别的文字。
          name: ${{ steps.version.outputs.name }}
          body: |
            **直接下载（手机浏览器打开即可，不用登录）**

            - 通用版（推荐，绝大多数手机）：[${{ github.server_url }}/${{ github.repository }}/releases/download/latest/ai-wechat.apk](${{ github.server_url }}/${{ github.repository }}/releases/download/latest/ai-wechat.apk)
            - arm64 精简版（体积小一点）：[${{ github.server_url }}/${{ github.repository }}/releases/download/latest/ai-wechat-arm64.apk](${{ github.server_url }}/${{ github.repository }}/releases/download/latest/ai-wechat-arm64.apk)

            安装时如果提示「禁止安装未知来源应用」，在弹窗里允许浏览器安装即可。

            ---
            构建来源：commit `${{ github.sha }}`
          files: |
            app/build/outputs/apk/github/release/ai-wechat.apk
            app/build/outputs/apk/github/release/ai-wechat-arm64.apk
          fail_on_unmatched_files: false